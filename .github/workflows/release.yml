name: Release
# Builds the Windows installer, the Android APK and a web zip from the same app files.
# - pull_request: build only, so every PR proves the installers still build
# - workflow_dispatch / tag push: build, then publish a GitHub Release v<package.json version>
# - a version with a suffix (1.3.0-beta.1) is published as a pre-release: apps on the Beta channel see it,
#   apps on the Stable channel ignore it. A plain version (1.3.0) is a normal (stable) release.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Release (creates tag v<version> on this commit)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # branch and tag names come in through env, never pasted into the script
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # a pushed tag must match package.json; a stable (no suffix) release must come from main
          if [ "$EVENT" = push ] && [ "$REF_NAME" != "v$v" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $v"; exit 1; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$PUBLISH" = true ] && [ "${v#*-}" = "$v" ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::Stable releases are published from main only (this is $REF)"; exit 1; fi

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the web app
        run: |
          bash scripts/copy-web.sh "PLC-Trainer-${{ needs.version.outputs.version }}-web"
          zip -qr "PLC-Trainer-${{ needs.version.outputs.version }}-web.zip" "PLC-Trainer-${{ needs.version.outputs.version }}-web"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: PLC-Trainer-*-web.zip

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: npm install
      - run: npm run dist:win
        env:
          BUILD_ID: v${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_ID: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm pkg set version=$VERSION
      - run: npm install
      - name: Create the Android project, icons and splash
        run: npm run android
      - name: Set app version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build APK
        working-directory: mobile/android
        # the signing key is given to this step only (not to npm install), and never to pull request builds
        env:
          KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          chmod +x gradlew
          # a published APK must be release-signed, or it will not install over the app users have
          if [ -z "$KEYSTORE_B64" ] && [ "$EVENT" != pull_request ]; then
            echo "::error::Android signing secrets are missing: not publishing a debug-signed APK. See RELEASING.md."; exit 1; fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PLC-Trainer-$VERSION-android.apk"
          else
            echo "::warning::No signing key in secrets: building a debug-signed APK. See RELEASING.md."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PLC-Trainer-$VERSION-android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PLC-Trainer-*-android.apk

  publish:
    needs: [version, web, windows, android]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the tag and the release
      actions: write    # and starts the Pages deploy, so the Stable copy of the hosted app moves to this release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.version.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          # a beta usually has no CHANGELOG section of its own yet: use [Unreleased]. A stable release must have its section.
          if [ ! -s notes.md ]; then
            case "$v" in
              *-*) awk '/^## \[Unreleased\]/ {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md ;;
              *) echo "::error::CHANGELOG.md has no section for [$v]"; exit 1 ;;
            esac
          fi
          case "$v" in *-*) printf '> **Beta (pre-release).** A snapshot for testing. Apps on the Beta update channel already get every change in-app.\n\n' | cat - notes.md > n && mv n notes.md;; esac
          {
            echo ""
            echo "## Downloads"
            echo "- **Windows**: \`PLC-Trainer-$v-portable.exe\` (no install: run it from any folder)"
            echo "- **Android**: \`PLC-Trainer-$v-android.apk\` (allow installing from this source when asked)"
            echo "- **Web / any device**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (installable as an app)"
            echo ""
            echo "Already have PLC Trainer 1.4.1 or newer? It updates itself inside the app: no download needed."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PLC Trainer v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.version, '-') }}
      - name: Update the hosted Stable app
        if: ${{ !contains(needs.version.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo ${{ github.repository }}
