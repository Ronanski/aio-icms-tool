<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Studio MT Mockup</title>
<!-- Visual mockup of the new PLC app (plc.html). Layout and sizes follow the desktop programming software
     the owner uses as the reference: 11 px text, 16 px icons, 22 px buttons, thin rungs. See docs/PLC_APP_SPEC.md. -->
<style>
  :root {
    --face: #f0f0f0; --face2: #e3e3e3; --edge: #a0a0a0; --edge2: #c8c8c8; --text: #000; --muted: #555;
    --sel: #316ac5; --selbg: #cce0f7; --paper: #fff; --wire: #000; --live: #00a000; --err: #d00000;
    --amber: #f2b200; --navy: #1f3a5f;
    --ui: Tahoma, Verdana, "Segoe UI", sans-serif; --lad: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #7a8796; font: 11px var(--ui); color: var(--text); }
  .pick { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; background: #2b3440; color: #fff; align-items: center; }
  .pick b { margin-right: 6px; }
  .pick button { font: 11px var(--ui); height: 22px; padding: 0 8px; border: 1px solid #556; background: #3a4554; color: #fff; cursor: pointer; }
  .pick button.on { background: #fff; color: #000; }
  .note { padding: 6px 16px; background: #fffbe6; border-bottom: 1px solid #e0d080; min-height: 26px; }
  .scroller { overflow-x: auto; padding: 12px 16px; }
  .win { position: relative; width: 1280px; height: 800px; margin: 0 auto; background: var(--face); border: 1px solid #333;
         display: grid; grid-template-rows: 22px 20px 28px 54px 1fr 118px 20px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .title { background: linear-gradient(#3d6ea8, #2c5a91); color: #fff; display: flex; align-items: center; padding: 0 6px; gap: 6px; }
  .title .x { margin-left: auto; letter-spacing: 10px; }
  .menu { display: flex; align-items: center; border-bottom: 1px solid var(--edge2); }
  .menu span { padding: 0 7px; line-height: 20px; }
  .menu span:hover { background: var(--selbg); }
  .tb { display: flex; align-items: center; gap: 1px; padding: 0 4px; border-bottom: 1px solid var(--edge2); }
  .btn { width: 23px; height: 22px; display: inline-grid; place-items: center; border: 1px solid transparent; }
  .btn:hover { border-color: var(--edge); background: #fff; }
  .sep { width: 1px; height: 18px; background: var(--edge2); margin: 0 3px; }
  .combo { height: 20px; border: 1px solid var(--edge); background: #fff; display: inline-flex; align-items: center; padding: 0 3px; gap: 4px; }
  .combo i { margin-left: auto; font-style: normal; border-left: 1px solid var(--edge2); padding-left: 3px; }
  .bar2 { display: flex; border-bottom: 1px solid var(--edge); }
  .online { width: 400px; height: 53px; display: grid; grid-template-columns: 96px 26px 1fr; gap: 4px; padding: 3px 6px; border-right: 1px solid var(--edge2); }
  .leds { display: grid; grid-template-rows: repeat(4, 11px); align-content: center; font-size: 9.5px; line-height: 11px; }
  .leds div { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .led { width: 9px; height: 7px; border: 1px solid #666; background: #bbb; flex: none; }
  .led.g { background: #2ecc40; } .led.y { background: var(--amber); } .led.r { background: #e33; }
  .key { display: grid; place-items: center; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 20px 20px; gap: 4px; align-content: center; }
  .box { border: 1px solid var(--edge); background: #fff; display: flex; align-items: center; padding: 0 4px; gap: 4px; white-space: nowrap; overflow: hidden; }
  .box i { margin-left: auto; font-style: normal; }
  .box.mode { font-weight: bold; }
  .box.warn { background: var(--amber); }
  .instr { flex: 1; display: grid; grid-template-rows: 28px 22px; padding: 2px 4px; min-width: 0; }
  .glyphs { display: flex; gap: 1px; align-items: center; }
  .gl { width: 30px; height: 24px; display: grid; place-items: center; border: 1px solid transparent; }
  .gl:hover { border-color: var(--edge); background: #fff; }
  .tabs { display: flex; align-items: flex-end; gap: 0; }
  .tabs span { padding: 2px 7px; border: 1px solid var(--edge2); border-top: none; background: var(--face2); margin-right: -1px; }
  .tabs span.on { background: var(--face); font-weight: bold; }
  .tabs .arr { margin-left: 4px; border: 1px solid var(--edge2); padding: 1px 4px; background: var(--face); }
  .main { display: grid; grid-template-columns: 236px 4px 1fr; min-height: 0; }
  .org { background: #fff; border: 1px solid var(--edge); margin: 2px 0 0 2px; display: grid; grid-template-rows: 18px 1fr 20px; min-height: 0; }
  .org .hdr, .pane-h { background: var(--face2); border-bottom: 1px solid var(--edge2); padding: 0 4px; line-height: 17px; }
  .tree { overflow: auto; padding: 2px 0; }
  .tree div { height: 17px; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .tree .pm { width: 9px; height: 9px; border: 1px solid #999; font-size: 9px; line-height: 7px; text-align: center; background: #fff; flex: none; }
  .tree .sp { width: 9px; flex: none; }
  .tree .on { background: var(--sel); color: #fff; }
  .org .foot { border-top: 1px solid var(--edge2); display: flex; }
  .org .foot span { padding: 2px 6px; border-right: 1px solid var(--edge2); }
  .org .foot span.on { background: #fff; font-weight: bold; }
  .editor { display: grid; grid-template-rows: 20px 24px 1fr; margin: 2px 2px 0 0; min-height: 0; border: 1px solid var(--edge); background: #fff; }
  .rtabs { display: flex; background: var(--face2); border-bottom: 1px solid var(--edge2); }
  .rtabs span { padding: 0 8px; line-height: 19px; border-right: 1px solid var(--edge2); }
  .rtabs span.on { background: #fff; }
  .rtb { display: flex; align-items: center; gap: 1px; padding: 0 3px; background: var(--face); border-bottom: 1px solid var(--edge2); }
  .rtb .btn.dim { opacity: .35; }
  .lad { overflow: auto; position: relative; }
  svg.l text { font: 11px var(--lad); }
  .errs { margin: 2px; border: 1px solid var(--edge); background: #fff; display: grid; grid-template-rows: 18px 24px 1fr; min-height: 0; }
  .chips { display: flex; gap: 4px; align-items: center; padding: 0 4px; background: var(--face); border-bottom: 1px solid var(--edge2); }
  .chip { border: 1px solid var(--edge); background: #fff; height: 19px; display: inline-flex; align-items: center; gap: 3px; padding: 0 5px; }
  .chip.on { background: var(--selbg); border-color: var(--sel); }
  .log { font: 11px Consolas, "Courier New", monospace; padding: 2px 4px; overflow: auto; white-space: pre; }
  .log .e { color: var(--err); }
  .status { display: flex; border-top: 1px solid var(--edge2); }
  .status span { padding: 0 6px; line-height: 19px; border-right: 1px solid var(--edge2); }
  .status span:first-child { flex: 1; }
  /* overlays */
  .pop { position: absolute; background: #fff; border: 1px solid #555; box-shadow: 2px 2px 6px rgba(0,0,0,.3); z-index: 5; }
  .cmenu { padding: 2px; min-width: 230px; background: var(--face); }
  .cmenu div { display: flex; justify-content: space-between; padding: 0 8px 0 22px; line-height: 19px; gap: 16px; }
  .cmenu div:hover, .cmenu div.on { background: var(--sel); color: #fff; }
  .cmenu hr { border: none; border-top: 1px solid var(--edge2); margin: 2px 0; }
  .cmenu .dis { color: #999; }
  .dlg { background: var(--face); }
  .dlg .dt { background: linear-gradient(#3d6ea8, #2c5a91); color: #fff; padding: 0 6px; line-height: 20px; display: flex; }
  .dlg .dt span:last-child { margin-left: auto; }
  .dlg .db { padding: 8px; }
  .row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 6px; margin-bottom: 5px; }
  .inp { height: 20px; border: 1px solid var(--edge); background: #fff; display: flex; align-items: center; padding: 0 3px; }
  .inp i { margin-left: auto; font-style: normal; }
  .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .pb { min-width: 72px; height: 22px; border: 1px solid #707070; background: linear-gradient(#fafafa, #e2e2e2); display: grid; place-items: center; }
  .pb.def { border-color: var(--sel); box-shadow: inset 0 0 0 1px #8bb3e6; }
  table.g { border-collapse: collapse; width: 100%; background: #fff; }
  table.g th { background: var(--face2); font-weight: normal; text-align: left; border: 1px solid var(--edge2); padding: 0 4px; line-height: 17px; }
  table.g td { border: 1px solid #e4e4e4; padding: 0 4px; line-height: 16px; white-space: nowrap; }
  table.g tr.on td { background: var(--sel); color: #fff; }
  .cb { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
  .cb.off::before { content: ""; }
  .cb::before { content: "✓"; width: 11px; height: 11px; border: 1px solid #777; background: #fff; font-size: 9px; line-height: 10px; text-align: center; }
</style>
</head>
<body>
<div class="pick" id="pick"><b>State:</b></div>
<div class="note" id="note"></div>
<div class="scroller">
<div class="win" id="win">
  <div class="title"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" fill="#e8eef6" stroke="#fff"/><path d="M3 4v6M11 4v6M3 7h8" stroke="#2c5a91" stroke-width="1.4"/></svg>
    <span id="ttl"></span><span class="x">_ □ ×</span></div>
  <div class="menu"><span>File</span><span>Edit</span><span>View</span><span>Search</span><span>Logic</span><span>Communications</span><span>Tools</span><span>Window</span><span>Help</span></div>
  <div class="tb" id="tb"></div>
  <div class="bar2">
    <div class="online">
      <div class="leds" id="leds"></div>
      <div class="key"><svg width="22" height="22" viewBox="0 0 22 22"><title>Key switch: PROG / REM / RUN</title><circle cx="11" cy="11" r="8" fill="#ddd" stroke="#666"/><rect id="keyb" x="9.5" y="4" width="3" height="14" fill="#444" transform="rotate(0 11 11)"/></svg></div>
      <div class="stat" id="stat"></div>
    </div>
    <div class="instr"><div class="glyphs" id="glyphs"></div><div class="tabs" id="tabs"></div></div>
  </div>
  <div class="main">
    <div class="org"><div class="hdr">Controller Organizer</div><div class="tree" id="tree"></div>
      <div class="foot"><span class="on">Controller</span><span>Logical</span></div></div>
    <div></div>
    <div class="editor">
      <div class="rtabs"><span class="on">MainProgram - MainRoutine<span id="dirty"></span></span><span>Controller Tags</span></div>
      <div class="rtb" id="rtb"></div>
      <div class="lad" id="lad"></div>
    </div>
  </div>
  <div class="errs"><div class="pane-h">Errors</div>
    <div class="chips" id="chips"></div><div class="log" id="log"></div></div>
  <div class="status" id="status"></div>
  <div id="ov"></div>
</div>
</div>
<script>
'use strict';
/* ---------- project data (tag-based, rung text as in the reference: XIC(tag)[a,b]OTE(tag);) ---------- */
const TAGS = {
  Start_PB:   { type: 'BOOL', alias: 'Local:1:I.Data.0', desc: 'S1 START PB' },
  Stop_PB:    { type: 'BOOL', alias: 'Local:1:I.Data.1', desc: 'S0 STOP PB (NC)' },
  OL_OK:      { type: 'BOOL', alias: 'Local:1:I.Data.2', desc: 'F1 OVERLOAD OK (NC)' },
  Motor_Run:  { type: 'BOOL', desc: 'Motor running (seal-in)' },
  Run_Timer:  { type: 'TIMER', desc: 'Run delay' },
  Run_Lamp:   { type: 'BOOL', alias: 'Local:2:O.Data.1', desc: 'H1 RUN LAMP' },
  Motor_Cmd:  { type: 'BOOL', alias: 'Local:2:O.Data.0', desc: 'KM1 MOTOR CONTACTOR' },
  Fault_Rst:  { type: 'BOOL', desc: 'Fault reset (HMI)' },
  Start_ONS:  { type: 'BOOL' },
  Start_Count:{ type: 'COUNTER', desc: 'Motor starts' },
};
const ALARM = { type: 'BOOL', alias: 'Local:2:O.Data.2', desc: 'H2 ALARM HORN' };
const VALS = { Start_PB: 0, Stop_PB: 1, OL_OK: 1, Motor_Run: 1, 'Run_Timer.EN': 1, 'Run_Timer.TT': 1, 'Run_Timer.DN': 0,
  'Run_Timer.PRE': 5000, 'Run_Timer.ACC': 3250, Run_Lamp: 0, Motor_Cmd: 1, Fault_Rst: 0, Start_ONS: 1,
  'Start_Count.CU': 1, 'Start_Count.DN': 0, 'Start_Count.PRE': 9999, 'Start_Count.ACC': 12, Alarm_Horn: 0 };
const BASE = [
  { c: 'Motor start / stop with seal-in. S0 STOP and F1 OVERLOAD are wired N.C., so XIC is true while healthy.',
    t: '[XIC(Start_PB),XIC(Motor_Run)]XIC(Stop_PB)XIC(OL_OK)OTE(Motor_Run);' },
  { c: 'Run lamp 5 s after the motor starts.', t: 'XIC(Motor_Run)TON(Run_Timer,5000,0);' },
  { t: 'XIC(Run_Timer.DN)OTE(Run_Lamp);' },
  { t: 'XIC(Motor_Run)OTE(Motor_Cmd);' },
  { c: 'Count motor starts.', t: 'XIC(Motor_Run)ONS(Start_ONS)CTU(Start_Count,9999,0);' },
  { t: 'XIC(Fault_Rst)OTE(Alarm_Horn);' },
];

/* ---------- instruction set used by the mockup ---------- */
const DEF = {
  XIC: { k: 'contact' }, XIO: { k: 'contact' }, ONS: { k: 'ons' },
  OTE: { k: 'coil', l: '' }, OTL: { k: 'coil', l: 'L' }, OTU: { k: 'coil', l: 'U' }, RES: { k: 'coil', l: 'RES' },
  TON: { k: 'box', title: 'Timer On Delay', f: ['Timer', 'Preset', 'Accum'], bits: ['EN', 'DN'] },
  CTU: { k: 'box', title: 'Count Up', f: ['Counter', 'Preset', 'Accum'], bits: ['CU', 'DN'] },
};
const isOut = e => e.t === 'BR' ? e.legs.every(l => l.length && isOut(l[l.length - 1])) : DEF[e.t].k === 'coil' || DEF[e.t].k === 'box';

function parse(s) {
  let i = 0;
  function seq() {
    const out = [];
    for (;;) {
      const c = s[i];
      if (c === undefined || c === ';' || c === ',' || c === ']') return out;
      if (c === '[') { i++; const legs = [seq()]; while (s[i] === ',') { i++; legs.push(seq()); } i++; out.push({ t: 'BR', legs }); continue; }
      const m = /^([A-Z]+)\(([^)]*)\)/.exec(s.slice(i));
      out.push({ t: m[1], a: m[2].split(',').map(x => x.trim()) });
      i += m[0].length;
    }
  }
  return seq();
}

/* ---------- mockup states ---------- */
const STATES = {
  offline: { label: 'Offline · errors', note: 'Offline editing. Rung 5 uses <b>Alarm_Horn</b>, which is not a tag yet, and rung 6 was just added: its operands show <b>?</b>. Both get the red marker; the Errors pane lists them. Tag description above, tag name, then the alias in &lt; &gt;.' },
  run: { label: 'Online · Rem Run', note: 'Online in Remote Run. Rails and powered wires turn green; a true instruction is drawn green. Box instructions show live values (Accum 3250). The online bar shows the mode and the controller LEDs.' },
  edit: { label: 'Online edit', note: 'Online edit of rung 2: <b>Start Pending Rung Edits</b> keeps the running rung (marker <b>r</b>, replace) and adds an editable copy (marker <b>i</b>, insert). Then Accept → Test → Assemble from the routine toolbar. The Edits box shows that edits exist.' },
  force: { label: 'Forces', note: 'OL_OK forced ON (right-click → Force On). The Forces box turns amber and says Forces Enabled; the forced instruction shows a small <b>F</b>. Toggle Bit (Ctrl+T) changes a bit once, it is not a force.' },
  menu: { label: 'Right-click menu', note: 'Right-click an instruction: New tag, Cut / Copy / Paste, Delete, Add Ladder Element, Edit description, Toggle Bit, Force, Go To, Cross Reference, Help.' },
  browse: { label: 'Tag browser', note: 'Addressing an operand: double-click it, type the name, or open ▾ for the tag browser. A TIMER expands to its members (.DN, .ACC …). Only tags of a fitting type are listed first.' },
  newtag: { label: 'New Tag', note: 'An operand that is not a tag yet: right-click → New "Alarm_Horn" (Ctrl+W). Name and type are filled in from the instruction. Create clears the red marker.' },
  xref: { label: 'Cross Reference', note: 'Ctrl+E on a tag: every place it is used. Double-click a row to go to that rung. Destructive = the instruction writes the tag.' },
};
let state = 'offline';
const online = () => state !== 'offline' && state !== 'newtag' && state !== 'browse' && state !== 'menu';

function rungs() {
  const r = BASE.map(x => ({ ...x }));
  if (state === 'edit') {
    r.splice(2, 1, { ...BASE[2], mk: 'r' }, { t: 'XIC(Run_Timer.DN)XIO(Fault_Rst)OTE(Run_Lamp);', mk: 'i' });
  }
  if (!online()) r.push({ t: 'XIC(?)OTE(?);' });
  return r;
}
const tag = name => {
  const base = name.split('.')[0];
  if (base === 'Alarm_Horn') return (online() ? ALARM : null);
  return TAGS[base] && (name.includes('.') ? { type: 'BOOL', member: true } : TAGS[base]);
};

/* ---------- ladder rendering ---------- */
const ctx = document.createElement('canvas').getContext('2d');
ctx.font = '11px Arial';
const tw = s => ctx.measureText(s).width;
const LH = 12;
function wrap(s, w) {
  const out = []; let cur = '';
  for (const word of s.split(' ')) { const t = cur ? cur + ' ' + word : word; if (tw(t) > w && cur) { out.push(cur); cur = word; } else cur = t; }
  if (cur) out.push(cur);
  return out.slice(0, 3);
}
function val(n) { return !!VALS[n]; }
function forced(n) { return state === 'force' && n === 'OL_OK'; }

function size(e) {
  if (e.t === 'BR') {
    const legs = e.legs.map(seqSize);
    let h = 0; legs.forEach((l, k) => { if (k) h += legs[k - 1].dn + 8 + l.up; });
    return (e.sz = { w: Math.max(...legs.map(l => l.w)) + 16, up: legs[0].up, dn: h + legs[legs.length - 1].dn, legs });
  }
  const d = DEF[e.t], n = e.a[0], tg = tag(n);
  if (d.k === 'box') {
    const w = Math.max(132, 70 + Math.max(...e.a.map(tw))) + 40;
    return (e.sz = { w: w + 8, up: 12, dn: 18 + d.f.length * 14 });
  }
  const lines = [n];
  if (tg && tg.alias) lines.push('<' + tg.alias + '>');
  const w = Math.max(64, ...lines.map(tw)) + 14;
  const desc = tg && tg.desc ? wrap(tg.desc, w - 8) : [];
  e.lines = [...desc, ...lines];
  return (e.sz = { w, up: 12 + e.lines.length * LH, dn: 12 });
}
function seqSize(arr) {
  let w = 0, up = 12, dn = 12;
  for (const e of arr) { const s = size(e); w += s.w; up = Math.max(up, s.up); dn = Math.max(dn, s.dn); }
  return { w: Math.max(w, 24), up, dn };
}

function draw(o, arr, x, y, pin) {
  let p = pin;
  for (const e of arr) { p = drawEl(o, e, x, y, p); x += e.sz.w; }
  return { p, x };
}
function wire(o, x1, x2, y, on) {
  if (x2 > x1) o.push(`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${on && online() ? 'var(--live)' : 'var(--wire)'}" stroke-width="${on && online() ? 2 : 1}"/>`);
}
function drawEl(o, e, x, y, pin) {
  const live = online();
  if (e.t === 'BR') {
    const { legs, w } = e.sz, b1 = x + 6, b2 = x + w - 6;
    let ly = y, pout = false, last = y;
    wire(o, x, b1, y, pin);
    e.legs.forEach((leg, k) => {
      if (k) ly += legs[k - 1].dn + 8 + legs[k].up;
      const r = draw(o, leg, b1, ly, pin);
      wire(o, r.x, b2, ly, r.p);
      pout = pout || r.p; last = ly;
    });
    const vc = on => `stroke="${on && live ? 'var(--live)' : 'var(--wire)'}" stroke-width="${on && live ? 2 : 1}"`;
    o.push(`<line x1="${b1}" y1="${y}" x2="${b1}" y2="${last}" ${vc(pin)}/><line x1="${b2}" y1="${y}" x2="${b2}" y2="${last}" ${vc(pout)}/>`);
    wire(o, b2, x + w, y, pout);
    return pout;
  }
  const d = DEF[e.t], n = e.a[0], cx = x + e.sz.w / 2, bad = n === '?' || !tag(n);
  if (state === 'menu' && e.sel) o.push(`<rect x="${x + 2}" y="${y - e.sz.up + 2}" width="${e.sz.w - 4}" height="${e.sz.up + e.sz.dn - 4}" fill="var(--selbg)" stroke="var(--sel)"/>`);
  if (d.k === 'box') {
    const bx = x + 6, bw = e.sz.w - 46, top = y - 9, h = 18 + d.f.length * 14;
    wire(o, x, bx, y, pin);
    o.push(`<rect x="${bx}" y="${top}" width="${bw}" height="${h}" fill="#fff" stroke="#000"/>`);
    o.push(`<rect x="${bx}" y="${top - 1}" width="${tw(e.t) + 10}" height="13" fill="#fff" stroke="#000"/><text x="${bx + 5}" y="${top + 9}" font-weight="bold">${e.t}</text>`);
    o.push(`<text x="${bx + tw(e.t) + 16}" y="${top + 10}">${d.title}</text>`);
    d.f.forEach((f, k) => {
      let v = e.a[k];
      if (k > 0 && live) v = String(VALS[e.a[0] + '.' + (k === 1 ? 'PRE' : 'ACC')]);
      o.push(`<text x="${bx + 5}" y="${top + 24 + k * 14}">${f}</text><text x="${bx + bw - 5}" y="${top + 24 + k * 14}" text-anchor="end">${v}</text>`);
    });
    d.bits.forEach((b, k) => {
      const yy = y + k * 14, on = live && val(e.a[0] + '.' + b), col = on ? 'var(--live)' : '#000';
      o.push(`<line x1="${bx + bw}" y1="${yy}" x2="${bx + bw + 6}" y2="${yy}" stroke="${col}"/><text x="${bx + bw + 8}" y="${yy + 4}" fill="${col}">(${b})</text>`);
      if (k === 0) wire(o, bx + bw + 32, x + e.sz.w, yy, pin);
    });
    return pin;
  }
  // operand text stack: description, tag name, <alias>
  e.lines.forEach((t, k) => {
    const isName = t === n;
    o.push(`<text x="${cx}" y="${y - 14 - (e.lines.length - 1 - k) * LH}" text-anchor="middle"${isName && bad && n !== '?' ? '' : ''}>${t.replace(/</g, '&lt;')}</text>`);
  });
  let pout = pin, on = false;

}

function errorsOf(list) {
  const errs = [];
  list.forEach((r, ri) => {
    const walk = arr => arr.forEach(e => {
      if (e.t === 'BR') return e.legs.forEach(walk);
      e.a.forEach((a, k) => {
        if (/^\d+$/.test(a)) return;
        if (a === '?') errs.push({ ri, m: `Rung ${ri}, ${e.t}, Operand ${k}: Missing operand.` });
        else if (!tag(a)) errs.push({ ri, m: `Rung ${ri}, ${e.t}, Operand ${k}: Undefined tag '${a}'.` });
      });
    });
    walk(r.el);
  });
  return errs;
}

function renderLadder() {
  const host = document.getElementById('lad'), W = host.clientWidth - 18, live = online();
  const list = rungs();
  list.forEach(r => { r.el = parse(r.t); });
  if (state === 'menu' || state === 'xref') list[0].el[0].legs[1][0].sel = true;
  if (state === 'browse') { list[2].el[0].edit = true; }
  const errs = errorsOf(list);
  const RL = 42, RR = W - 6;
  const o = []; let y = 6;
  list.forEach((r, ri) => {
    const k = r.el.findIndex((e, i) => r.el.slice(i).every(isOut));
    const ins = k < 0 ? r.el : r.el.slice(0, k), outs = k < 0 ? [] : r.el.slice(k);
    const a = seqSize(ins), b = seqSize(outs);
    const cl = r.c ? wrap(r.c, RR - RL - 16) : [];
    const top = y;
    cl.forEach((t, i) => o.push(`<text x="${RL + 8}" y="${y + 11 + i * 13}" fill="#000">${t}</text>`));
    y += cl.length * 13 + (cl.length ? 4 : 0);
    const by = y + Math.max(a.up, b.up) + 4;
    const bottom = by + Math.max(a.dn, b.dn) + 6;
    const selR = (state === 'menu' || state === 'xref') && ri === 0;
    // rung number cell (blue when the rung is selected), error and edit markers
    if (selR) o.push(`<rect x="2" y="${by - 8}" width="${RL - 14}" height="15" fill="var(--sel)"/>`);
    o.push(`<text x="${RL - 14}" y="${by + 4}" text-anchor="end" fill="${selR ? '#fff' : '#000'}">${ri}</text>`);
    if (errs.some(x => x.ri === ri)) o.push(`<circle cx="8" cy="${by}" r="5.5" fill="none" stroke="var(--err)" stroke-width="1.4"/><path d="M5 ${by - 3}l6 6M11 ${by - 3}l-6 6" stroke="var(--err)" stroke-width="1.4"/>`);
    if (r.mk) o.push(`<line x1="${RL - 6}" y1="${top + 2}" x2="${RL - 6}" y2="${bottom - 2}" stroke="#000" stroke-dasharray="2 2"/><text x="6" y="${by + 4}" font-weight="bold" font-size="12">${r.mk}</text>`);
    const powered = live && !(r.mk === 'i');
    const L = draw(o, ins, RL, by, powered);
    const ox = RR - b.w;
    wire(o, L.x, ox, by, powered && L.p);
    draw(o, outs, ox, by, powered && L.p);
    if (r.mk === 'i') o.push(`<rect x="${RL + 1}" y="${top}" width="${RR - RL - 2}" height="${bottom - top}" fill="none" stroke="#999" stroke-dasharray="3 2"/>`);
    y = bottom + 8;
  });
  o.push(`<text x="${(RL + RR) / 2}" y="${y + 10}" text-anchor="middle">(End)</text>`);
  wire(o, RL, (RL + RR) / 2 - 22, y + 6, live); wire(o, (RL + RR) / 2 + 22, RR, y + 6, live);
  const H = y + 22, railC = live ? 'var(--live)' : '#000', railW = live ? 3 : 1;
  host.innerHTML = `<svg class="l" width="${W}" height="${H}"><line x1="${RL}" y1="0" x2="${RL}" y2="${H - 8}" stroke="${railC}" stroke-width="${railW}"/><line x1="${RR}" y1="0" x2="${RR}" y2="${H - 8}" stroke="${railC}" stroke-width="${railW}"/>${o.join('')}</svg>`;
  return { errs, n: list.length };
}

    <div class="row"><span></span><span class="cb off">Constant</span></div>
    <div class="btns"><span class="pb def">Create</span><span class="pb">Cancel</span><span class="pb">Help</span></div></div></div>`;
  if (state === 'xref') ov.innerHTML = `<div class="pop dlg" style="left:300px;top:250px;width:620px">
    <div class="dt"><span>Cross Reference - Motor_Run</span><span>×</span></div><div class="db" style="padding:6px">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">Tag: <span class="combo" style="width:200px">Motor_Run<i>▾</i></span> Scope: <span class="combo" style="width:140px">Motor_Demo<i>▾</i></span><span class="pb" style="margin-left:auto">Refresh</span></div>
    <table class="g"><tr><th>Container</th><th>Routine</th><th>Location</th><th>Reference</th><th>BaseTag</th><th>Destructive</th></tr>
      ${[['MainProgram', 'MainRoutine', 'Rung 0', 'XIC', 'Motor_Run', 'N'], ['MainProgram', 'MainRoutine', 'Rung 0', 'OTE', 'Motor_Run', 'Y'], ['MainProgram', 'MainRoutine', 'Rung 1', 'XIC', 'Motor_Run', 'N'],
         ['MainProgram', 'MainRoutine', 'Rung 3', 'XIC', 'Motor_Run', 'N'], ['MainProgram', 'MainRoutine', 'Rung 4', 'XIC', 'Motor_Run', 'N']]
        .map((r, i) => `<tr class="${i === 1 ? 'on' : ''}">${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>
    <div class="btns"><span class="pb">Go To</span><span class="pb def">Close</span></div></div></div>`;
}

function render() {
  document.getElementById('pick').innerHTML = '<b>State:</b>' + Object.entries(STATES).map(([k, s]) => `<button data-s="${k}" class="${k === state ? 'on' : ''}">${s.label}</button>`).join('');
  document.getElementById('note').innerHTML = STATES[state].note;
  const info = renderLadder();
  chrome(info);
  overlays();
}
document.getElementById('pick').addEventListener('click', e => { const s = e.target.dataset.s; if (s) { state = s; render(); } });
render();
</script>
</body>
