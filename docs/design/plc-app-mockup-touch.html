<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT PLC Studio Touch</title>
<!-- Mockup of the tablet and phone layouts of MT PLC Studio (docs/PLC_APP_SPEC.md section 3a). Same functionality
     as the desktop mockup (plc-app-mockup.html), laid out for touch. The ladder runs on the real engine
     (mtps/js/engine.js). URL: ?dev=phone|tab-l|tab-p&state=ladder|run|menu|add|tag|online|errors|tags|project|edit
     &theme=dark&scale=1 -->
<style>
  :root {
    --bg: #E9EDF1; --surface: #FFFFFF; --surface-2: #F3F5F8; --surface-3: #E3E8EE;
    --border: #D5DCE3; --border-strong: #B4BEC9; --text: #17202B; --muted: #5A6675;
    --accent: #1F64B8; --accent-soft: #DCE8F7; --accent-text: #1A57A3; --fill-accent: #1F64B8;
    --ok: #1E8E46; --fill-ok: #1E7F3F; --warn: #B87800; --warn-text: #8A5A00; --on-warn: #1A1300; --amber: #F2B200;
    --danger: #C8362B; --fill-danger: #C0392B;
    --lad-bg: #FFFFFF; --lad-wire: #3A4350; --lad-on: #1B9E48; --lad-online: #2F6FD0; --lad-desc: #5A6675; --lad-alias: #1A57A3;
    --scrim: rgba(15, 20, 25, .42); --shadow: 0 8px 28px rgba(15, 20, 25, .22);
    --ui: Inter, Roboto, "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, "Roboto Mono", monospace;
    --r-sm: 4px; --r: 6px; --r-lg: 8px;
  }
  [data-theme="dark"] {
    --bg: #0F1419; --surface: #171D24; --surface-2: #1D242C; --surface-3: #262E38;
    --border: #2A333E; --border-strong: #404B58; --text: #E4E9EF; --muted: #93A0AE;
    --accent: #4C8DFF; --accent-soft: #1A2E4D; --accent-text: #8DB6FF; --fill-accent: #2F6AD6;
    --ok: #2FB866; --warn: #E0A12A; --warn-text: #E0A12A; --danger: #F0594C;
    --lad-bg: #12171D; --lad-wire: #AEB8C4; --lad-on: #3DDC75; --lad-online: #6FA3FF; --lad-desc: #93A0AE; --lad-alias: #8DB6FF;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #59626e; font: 13px var(--ui); color: var(--text); }
  .pick { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 8px 12px; background: #232a33; color: #fff; align-items: center; }
  .pick b { margin: 0 4px 0 8px; font-weight: 600; }
  .pick b:first-child { margin-left: 0; }
  .pick button { font: 12px var(--ui); min-height: 28px; padding: 0 10px; border: 1px solid #4a5563; border-radius: 4px; background: #333d4a; color: #fff; cursor: pointer; }
  .pick button.on { background: #fff; color: #111; border-color: #fff; }
  .note { padding: 8px 12px; background: #fffbe6; color: #2b2400; border-bottom: 1px solid #e6d58a; font-size: 12px; line-height: 1.45; }
  .stage { display: flex; justify-content: center; padding: 16px 12px 24px; overflow: hidden; }
  .holder { position: relative; flex: none; }
  .dev { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); color: var(--text); overflow: hidden;
         border-radius: 18px; box-shadow: 0 0 0 10px #15191f, 0 12px 40px rgba(0,0,0,.45); font: 13px var(--ui); }
  .dev.phone { border-radius: 28px; font-size: 14px; }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ib { min-width: 44px; height: 44px; border: 0; background: transparent; border-radius: var(--r); display: inline-grid; place-items: center; cursor: pointer; color: var(--text); }
  .ib:active, .ib.on { background: var(--surface-3); }
  .ib.dim { color: var(--muted); opacity: .45; }
  .phone .ib { min-width: 48px; height: 48px; }
  .grow { flex: 1; min-width: 0; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }

  /* ---- shared: status boxes (mode, forces, edits) ---- */
  .sbox { height: 36px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); display: inline-flex; align-items: center;
          gap: 6px; padding: 0 8px 0 10px; white-space: nowrap; font-weight: 600; cursor: pointer; }
  .sbox .cv { width: 16px; height: 16px; }
  .sbox.run { background: var(--fill-ok); border-color: var(--fill-ok); color: #fff; }
  .sbox.forces { font-weight: 500; }
  .sbox .fi { width: 12px; height: 12px; border-radius: 2px; background: var(--surface-3); border: 1px solid var(--border-strong); }
  .sbox .fi.en { background: var(--amber); border-color: #9a7200; }
  .sbox .fi.dis { background: #3fbf5f; border-color: #1e7f3f; }
  .phone .sbox { height: 32px; padding: 0 8px; font-size: 13px; }

  /* ---- tablet ---- */
  .appbar { height: 56px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; }
  .appbar .proj { font-weight: 600; font-size: 15px; margin: 0 6px 0 2px; white-space: nowrap; }
  .appbar .proj small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .appbar .vsep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }
  .pbtn { height: 40px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--fill-accent); background: var(--fill-accent); color: #fff; font-weight: 600;
          display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .pbtn.sec { background: var(--surface); color: var(--accent-text); border-color: var(--border-strong); }
  .pbtn.danger { background: var(--fill-danger); border-color: var(--fill-danger); }
  .tbody { flex: 1; display: flex; min-height: 0; position: relative; }
  .drawer { width: 256px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; flex: none; }
  .drawer.over { position: absolute; left: 0; top: 0; bottom: 0; z-index: 6; box-shadow: var(--shadow); }
  .dh { height: 40px; display: flex; align-items: center; padding: 0 4px 0 14px; font-weight: 600; border-bottom: 1px solid var(--border); flex: none; }
  .tree { overflow: auto; padding: 4px 0; flex: 1; }
  .tree div { height: 40px; display: flex; align-items: center; gap: 6px; padding-right: 10px; white-space: nowrap; cursor: pointer; }
  .phone .tree div { height: 48px; }
  .tree .tw { width: 22px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .tree .tw svg { width: 16px; height: 16px; }
  .tree .ti { width: 18px; height: 18px; color: var(--muted); }
  .tree div.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; box-shadow: inset 3px 0 var(--accent); }
  .tree .fault { margin-left: auto; color: var(--danger); font-size: 12px; font-weight: 600; }
  .ed { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .rtabs { height: 44px; display: flex; align-items: stretch; background: var(--surface-2); border-bottom: 1px solid var(--border); flex: none; overflow: hidden; }
  .rtabs .t { padding: 0 16px; display: flex; align-items: center; border-right: 1px solid var(--border); white-space: nowrap; color: var(--muted); }
  .rtabs .t.on { background: var(--lad-bg); color: var(--text); font-weight: 600; box-shadow: inset 0 -2px var(--accent); }
  .rtabs .ib { margin-left: auto; height: 43px; }
  .lad { flex: 1; overflow: auto; background: var(--lad-bg); position: relative; -webkit-overflow-scrolling: touch; }
  .selbar { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; background: var(--surface); border-top: 1px solid var(--border); flex: none; }
  .selbar .mn { font-weight: 700; font-family: var(--mono); }
  .selbar .op { font-family: var(--mono); color: var(--accent-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .selbar .ds { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .selbar .pos { color: var(--muted); white-space: nowrap; font-size: 12px; }
  .ibar { background: var(--surface); border-top: 1px solid var(--border); flex: none; }
  .ibar .gl { display: flex; gap: 4px; padding: 6px 8px 2px; overflow-x: auto; }
  .gbtn { width: 52px; height: 48px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2); display: grid; place-items: center;
          align-content: center; gap: 1px; cursor: pointer; flex: none; }
  .gbtn span { font: 600 10.5px var(--mono); color: var(--muted); }
  .gbtn svg { width: 30px; height: 18px; }
  .gbtn.drag { opacity: .35; }
  .ibar .tabs { display: flex; align-items: center; gap: 2px; padding: 2px 8px 6px; overflow-x: auto; }
  .chipt { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid transparent; background: transparent; display: inline-flex; align-items: center; white-space: nowrap;
           color: var(--muted); cursor: pointer; flex: none; }
  .chipt.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .errh { margin-left: auto; height: 34px; padding: 0 10px; border-radius: 17px; border: 1px solid var(--border-strong); background: var(--surface); display: inline-flex;
          align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; flex: none; }
  .errh .n { color: var(--danger); font-weight: 700; }

  /* ---- floating layers ---- */
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 8; }
  .pop { position: absolute; z-index: 9; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
  .menu { padding: 6px 0; min-width: 300px; }
  .pop.fit { max-height: calc(100% - 16px); overflow: auto; }
  .menu .it { min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; white-space: nowrap; }
  .menu .it .k { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); padding-left: 18px; }
  .menu .it.dis { color: var(--muted); opacity: .5; }
  .menu .it svg { width: 20px; height: 20px; color: var(--muted); }
  .menu .it.new { color: var(--accent-text); font-weight: 600; }
  .menu .it.new svg { color: var(--accent-text); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
  .menu .hd { padding: 8px 16px 4px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
           display: flex; flex-direction: column; max-height: 86%; }
  .sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 8px auto 4px; flex: none; }
  .sheet .sh { display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px 16px; flex: none; }
  .sheet .sh b { font-size: 16px; }
  .sheet .sb { overflow: auto; flex: 1; }
  .ctx { padding: 0 16px 8px; font-family: var(--mono); color: var(--muted); font-size: 13px; flex: none; }
  .field { height: 44px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 10px; }
  .field.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .field .cur { width: 1.5px; height: 20px; background: var(--accent); margin-left: -6px; }
  .phone .field { height: 48px; }
  .fchips { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; flex: none; }
  .fchip { height: 34px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 17px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
  .fchip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .list .row { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 6px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .list .row.on { background: var(--accent-soft); }
  .list .row .nm { font-family: var(--mono); font-weight: 600; }
  .list .row .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .list .row .ty { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--surface-3); border-radius: var(--r-sm); padding: 2px 6px; white-space: nowrap; }
  .list .row .val { margin-left: auto; font-family: var(--mono); font-weight: 600; min-width: 40px; text-align: right; }
  .list .row .val.on { color: var(--ok); }
  .list .row .exp { width: 22px; color: var(--muted); }
  .list .grp { padding: 14px 16px 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; background: var(--surface-2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 4px 16px 16px; }
  .tile { min-height: 76px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-2); display: grid; justify-items: center; align-content: center;
          gap: 4px; padding: 6px; text-align: center; cursor: pointer; }
  .tile svg { width: 40px; height: 22px; }
  .tile b { font: 700 13px var(--mono); }
  .tile small { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .errline { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: flex-start; cursor: pointer; }
  .errline .x { color: var(--danger); flex: none; margin-top: 1px; }
  .errline .w { color: var(--warn); }
  .errline .tx { font-family: var(--mono); font-size: 12.5px; line-height: 1.45; }
  .errline .go { margin-left: auto; color: var(--accent-text); white-space: nowrap; font-weight: 600; flex: none; }
  .echips { display: flex; gap: 6px; padding: 0 16px 10px; flex: none; }
  .echip { height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--border-strong); display: inline-flex; align-items: center; gap: 6px; }
  .echip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .cmpl { border-bottom: 1px solid var(--border); padding: 10px 16px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

  /* ---- phone ---- */
  .abar { height: 28px; display: flex; align-items: center; padding: 0 18px; font-size: 12px; font-weight: 600; flex: none; background: var(--surface); }
  .abar .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .strip { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; }
  .strip .warn { margin-left: auto; height: 32px; padding: 0 10px; border-radius: 16px; background: #fbe4e1; color: var(--fill-danger); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex: none; }
  [data-theme="dark"] .strip .warn { background: #3b1d1a; color: #ff8a80; }
  .pbar { height: 52px; display: flex; align-items: center; gap: 2px; padding: 0 2px 0 6px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; }
  .pbar .rt { display: flex; align-items: center; gap: 2px; font-weight: 600; font-size: 16px; padding: 0 8px; height: 48px; border-radius: var(--r); white-space: nowrap; min-width: 0; }
  .pbar .rt .tt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .pbar .rt small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .pbar .rt svg { width: 18px; height: 18px; color: var(--muted); }
  .fab { position: absolute; right: 16px; width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--fill-accent); color: #fff; display: grid; place-items: center;
         box-shadow: 0 6px 16px rgba(20, 60, 120, .35); z-index: 4; cursor: pointer; }
  .fab svg { width: 26px; height: 26px; stroke-width: 2.2; }
  .pnav { height: 68px; display: flex; background: var(--surface); border-top: 1px solid var(--border); flex: none; padding-bottom: 4px; }
  .pnav div { flex: 1; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 12px; color: var(--muted); cursor: pointer; position: relative; }
  .pnav div .pill { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  .pnav div.on { color: var(--text); font-weight: 700; }
  .pnav div.on .pill { background: var(--accent-soft); color: var(--accent-text); }
  .pnav .bd { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--fill-danger); color: #fff; font-size: 11px;
              font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
  .gest { height: 18px; display: grid; place-items: center; background: var(--surface); flex: none; }
  .gest i { width: 120px; height: 4px; border-radius: 2px; background: var(--text); opacity: .7; }
  .page { flex: 1; overflow: auto; background: var(--bg); min-height: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); margin: 12px; overflow: hidden; }
  .card .ch { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; font-weight: 700; }
  .card .cb { padding: 6px 14px 14px; }
  .leds4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .leds4 div { display: flex; align-items: center; gap: 8px; }
  .led { width: 14px; height: 10px; border-radius: 2px; background: #c9ced5; border: 1px solid #8d96a1; flex: none; }
  .led.g { background: #2ecc40; border-color: #1e7f3f; }
  .led.y { background: var(--amber); }
  .seg { display: flex; border: 1px solid var(--border-strong); border-radius: var(--r); overflow: hidden; height: 44px; }
  .seg span { flex: 1; display: grid; place-items: center; border-right: 1px solid var(--border-strong); font-weight: 600; color: var(--muted); }
  .seg span:last-child { border-right: 0; }
  .seg span.on { background: var(--fill-accent); color: #fff; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .kv:last-child { border-bottom: 0; }
  .kv .v { font-family: var(--mono); text-align: right; }
  .brow { display: flex; gap: 8px; margin-top: 12px; }
  .brow .pbtn { flex: 1; justify-content: center; height: 48px; }
  .pts { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .pt { display: grid; justify-items: center; gap: 3px; font: 11px var(--mono); color: var(--muted); }
  .pt i { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--surface-2); display: grid; place-items: center; font-style: normal; }
  .pt i.on { background: #2ecc40; border-color: #1e7f3f; }
  .pt i.lamp.on { background: #ffd23f; border-color: #a68300; box-shadow: 0 0 10px #ffd23f; }
  .pt i.pb { border-radius: 8px; }
  .toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--surface-3); border: 1px solid var(--border-strong); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .toggle.on { background: var(--amber); border-color: #9a7200; }
  .toggle.on::after { left: 20px; }
  .tsheet { position: absolute; z-index: 9; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .full { position: absolute; inset: 0; z-index: 9; background: var(--surface); display: flex; flex-direction: column; }
  .seg2 { display: flex; background: var(--surface-3); border-radius: 18px; padding: 3px; margin: 8px 16px; flex: none; }
  .seg2 span { flex: 1; height: 34px; display: grid; place-items: center; border-radius: 15px; color: var(--muted); font-weight: 600; }
  .seg2 span.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .ghost { position: absolute; z-index: 7; width: 60px; height: 52px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow);
           display: grid; place-items: center; align-content: center; gap: 2px; transform: rotate(-3deg); }
  .ghost svg { width: 34px; height: 20px; }
  .ghost span { font: 700 11px var(--mono); color: var(--accent-text); }
  .hint { position: absolute; z-index: 7; background: #17202b; color: #fff; border-radius: var(--r); padding: 6px 10px; font-size: 12px; white-space: nowrap; }

  /* ---- ladder (SVG) ---- */
  svg.l { display: block; user-select: none; -webkit-user-select: none; touch-action: pan-x pan-y pinch-zoom; }
  svg.l text { font-family: Arial, Roboto, Helvetica, sans-serif; fill: var(--text); }
  svg.l .nm { font-size: 12px; }
  svg.l .ds { font-size: 11px; fill: var(--lad-desc); }
  svg.l .al { font-size: 11px; fill: var(--lad-alias); }
  svg.l .cm { font-size: 12px; fill: var(--lad-alias); }
  svg.l .rn { font-size: 12px; fill: var(--muted); }
  svg.l .w, svg.l .rail { stroke: var(--lad-wire); stroke-width: 1; shape-rendering: crispEdges; fill: none; }
  svg.l.online .w, svg.l.online .rail { stroke: var(--lad-online); }
  svg.l.run .rail { stroke: var(--lad-on); stroke-width: 3; }
  svg.l .rail.ed { stroke: var(--lad-online); stroke-width: 1; }

    <span class="vsep"></span>${live() ? `<span class="pbtn danger">${ic('online')}Go Offline</span>` : `<span class="pbtn">${ic('online')}Go Online</span>`}</div>`;
  const drawer = pinned || state === 'project' ? `<div class="drawer${pinned ? '' : ' over'}"><div class="dh grow">Controller Organizer<span class="grow"></span><button class="ib">${ic(pinned ? 'moreh' : 'close')}</button></div><div class="tree">${treeHTML()}</div></div>` : '';
  const ladW = W - (pinned ? 256 : 0);
  const ed = `<div class="ed"><div class="rtabs">${pinned ? '' : `<button class="ib" style="margin:0">${ic('tree')}</button>`}<span class="t on">MainProgram - MainRoutine</span><span class="t">Controller Tags</span><button class="ib">${ic('more')}</button></div>
    <div class="lad" id="ladwrap">${ladderHTML(ladW, 112)}</div>
    <div class="selbar"><span class="mn">${e.t}</span><span class="op">${esc(e.a.join(', '))}</span><span class="ds grow">${esc((TAG[String(e.a[0] || '').toUpperCase()] || {}).desc || '')}</span><span class="pos">Rung ${sel.ri} of ${rungsNow(live()).length}</span>
      <button class="ib">${ic('edit')}</button><button class="ib${live() ? '' : ' dim'}">${ic('toggle')}</button><button class="ib">${ic('moreh')}</button></div>
    <div class="ibar"><div class="gl">${TABS[tab].map(m => `<span class="gbtn${state === 'add' && m === 'XIO' ? ' drag' : ''}" title="${NAMES[m]}">${glyph(m)}<span>${m === 'RUNG' ? 'Rung' : m === 'BR' ? 'Branch' : m}</span></span>`).join('')}</div>
      <div class="tabs">${Object.keys(TABS).map(t => `<span class="chipt${t === tab ? ' on' : ''}">${t}</span>`).join('')}<span class="errh">${ic('warn')}<span class="n">${live() ? 0 : nErr()}</span> Errors ${ic('down')}</span></div></div></div>`;
  let over = '';
  const L = pinned ? 256 : 0;
  if (state === 'menu') over = `<div class="pop fit" style="left:${L + 150}px;top:${land ? 8 : 170}px">${ctxMenu(true)}</div>`;
  if (state === 'add') over = `<div class="ghost" style="left:${L + 140}px;top:${land ? 430 : 560}px">${glyph('XIO')}<span>XIO</span></div><div class="hint" style="left:${L + 210}px;top:${land ? 440 : 570}px">Drop on rung 3 before XIC Motor_Run</div>`;
  if (state === 'tag') over = `<div class="tsheet" style="left:${L + 40}px;top:${land ? 170 : 190}px;width:480px;height:${land ? 440 : 520}px"><div class="sh" style="padding:12px 8px 0 16px"><b class="grow">XIC · Operand 0</b><button class="ib">${ic('close')}</button></div>${tagBrowser(false)}</div>`;
  if (state === 'online') over = `<div class="pop" style="left:170px;top:52px"><div class="menu"><div class="hd">Mode · key switch in REM</div>
      <div class="it dis">${ic('online')}Go Online</div><div class="it">${ic('stop')}Program Mode</div><div class="it dis">${ic('play')}Run Mode</div><div class="it">${ic('download')}Download…</div><hr>
      <div class="it">${ic('online')}Go Offline</div><div class="it">${ic('search')}Who Active…</div></div></div>`;
  if (state === 'errors') over = `<div class="sheet" style="height:44%;left:${L}px"><div class="grab"></div><div class="sh"><b class="grow">Errors</b><button class="ib">${ic('search')}</button><button class="ib">${ic('close')}</button></div><div class="sb">${errorsBody()}</div></div>`;
  if (state === 'tags') over = `<div class="scrim"></div><div class="tsheet" style="left:${(W - 720) / 2}px;top:64px;width:720px;height:${H - 120}px"><div class="sh" style="padding:12px 8px 0 16px"><b class="grow">Controller Tags · Motor_Demo</b><button class="ib">${ic('search')}</button><button class="ib">${ic('plus')}</button><button class="ib">${ic('close')}</button></div>
      <div class="seg2" style="max-width:320px"><span class="on">Monitor Tags</span><span>Edit Tags</span></div><div class="sb list">${tagRows()}</div></div>`;
  if (state === 'project' && !pinned) over = `<div class="scrim" style="z-index:5"></div>`;
  return `<div class="scr">${app}<div class="tbody">${drawer}${ed}${over}</div></div>`;
}

/* ---------------- render ---------------- */
function render() {
  document.documentElement.dataset.theme = theme;
  const D = DEVS[dev], el = document.getElementById('dev');
  el.className = 'dev ' + (dev === 'phone' ? 'phone' : 'tablet');
  el.dataset.theme = theme;
  el.style.width = D.w + 'px'; el.style.height = D.h + 'px';
  el.innerHTML = dev === 'phone' ? phone() : tablet(dev === 'tab-l');
  const pick = document.getElementById('pick');
  pick.innerHTML = `<b>Device</b>${Object.entries(DEVS).map(([k, v]) => `<button data-dev="${k}" class="${k === dev ? 'on' : ''}">${v.n}</button>`).join('')}
    <b>State</b>${Object.entries(STATES).map(([k, v]) => `<button data-st="${k}" class="${k === state ? 'on' : ''}">${v[0]}</button>`).join('')}
    <b>Theme</b><button data-th="light" class="${theme === 'light' ? 'on' : ''}">Light</button><button data-th="dark" class="${theme === 'dark' ? 'on' : ''}">Dark</button>`;
  document.getElementById('note').innerHTML = `<b>${D.n} · ${STATES[state][0]}.</b> ${STATES[state][1]}`;
  fit();
  sig = '';
}
function fit() {
  const D = DEVS[dev], el = document.getElementById('dev'), h = document.getElementById('holder');
  const availW = innerWidth - 48, availH = innerHeight - document.getElementById('stage').getBoundingClientRect().top - 40;
  const s = fixedScale || Math.min(1, availW / (D.w + 20), Math.max(.35, availH / (D.h + 20)));
  el.style.transform = `scale(${s})`;
  h.style.width = D.w * s + 'px'; h.style.height = D.h * s + 'px';
}
addEventListener('resize', fit);
document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-dev],button[data-st],button[data-th]');
  if (b) { if (b.dataset.dev) dev = b.dataset.dev; if (b.dataset.st) state = b.dataset.st; if (b.dataset.th) theme = b.dataset.th; render(); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { state = { Ladder: live() ? 'run' : 'ladder', Tags: 'tags', Controller: 'online', Project: 'project', More: 'errors' }[g.dataset.go]; render(); return; }
  const t = ev.target.closest('rect.tap');
  if (t) {
    sel = { ri: +t.dataset.ri, path: t.dataset.p.split('.').map(Number) };
    // online: tapping S1 presses it in the field, as the I/O panel does
    const e = selInfo(live());
    if (live() && e.a && e.a[0] === 'Start_PB') pressT = simT + .05;
    render();
  }
});

/* ---------------- live: the controller scans on its own clock; the ladder is redrawn only when a value changes ---------------- */
let sig = '', last = performance.now();
function loop(now) {
  const dt = Math.min(100, now - last); last = now; simT += dt / 1000;
  field = simT >= pressT && simT < pressT + .3 ? 0b111 : 0b110;
  ctl.setInputs(1, field);
  ctl.advance(dt);
  if (live()) {
    const R = rungsNow(true), parts = [];
    const walk = e => { if (e.t === 'BR') e.legs.forEach(l => l.forEach(walk)); else parts.push(e.v ? 1 : 0, e.bv ? e.bv.ACC + ':' + e.bv.DN : ''); };
    R.forEach(r => r.elems.forEach(walk));
    const s = parts.join('');
    if (s !== sig) {
      sig = s;
      const w = document.getElementById('ladwrap');
      if (w) { const st = w.scrollTop; w.innerHTML = ladderHTML(dev === 'phone' ? 390 : (dev === 'tab-l' ? 1024 - 256 : 768), dev === 'phone' ? 80 : 112); w.scrollTop = st; }
      if (state === 'online' && dev === 'phone') { const p = document.querySelector('.page'), st = p && p.scrollTop; render(); const p2 = document.querySelector('.page'); if (p2) p2.scrollTop = st; }
    }
  }
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script>
</body>
