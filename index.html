<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PLC Trainer</title>
  <script>
    /* Runs before the app. On the hosted app (GitHub Pages): take projects handed over by the app's built-in copy,
       and open the copy of the chosen update channel (Stable at the root, Beta under /beta/).
       In the Windows/Android app's built-in copy: move to the hosted app, which updates itself, bringing this
       device's projects along. ?local=1 keeps the built-in copy (offline first start, tests). */
    (function () {
      var PAGES = 'https://ronanski.github.io/aio-icms-tool/', ls;
      try { ls = window.localStorage; ls.length; } catch (e) { return; }
      var ch = ls.getItem('plc-trainer.channel');
      if (location.href.indexOf(PAGES) === 0) {
        var m = /^#import=(.+)$/.exec(location.hash);
        if (m) {
          try {
            var d = JSON.parse(decodeURIComponent(m[1])), IDX = 'plc-trainer.projects.v2', P = 'plc-trainer.proj.';
            // only projects (merged by id, the newer copy wins), the current project and the channel; nothing else is taken
            // from a link, and every project is checked again by the app when it is opened
            var list = function (v) { try { var a = JSON.parse(v || '[]'); return Object.prototype.toString.call(a) === '[object Array]' ? a : []; } catch (e) { return []; } };
            var mine = list(ls.getItem(IDX)), theirs = list(d[IDX]), changed = false;
            for (var i = 0; i < theirs.length; i++) {
              var t = theirs[i], id = t && t.id, data = typeof id === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(id) ? d[P + id] : null;
              if (typeof data !== 'string' || data.length > 4000000) continue;
              try { if (!JSON.parse(data) || typeof JSON.parse(data) !== 'object') continue; } catch (e) { continue; }
              var up = Number(t.updated) || 0, here = null;
              for (var j = 0; j < mine.length; j++) if (mine[j] && mine[j].id === id) here = mine[j];
              if (here && (Number(here.updated) || 0) >= up) continue;
              if (here && ls.getItem(P + id) !== null) {
                // the hosted copy changed too: keep it as a copy before the newer one from the device takes its place
                var keep = id.slice(0, 34) + '-web';
                ls.setItem(P + keep, ls.getItem(P + id));
                mine.push({ id: keep, name: String(here.name || 'Untitled').slice(0, 70) + ' (web copy)', updated: Number(here.updated) || 0 });
                mine = mine.filter(function (x) { return x !== here; });
              }
              ls.setItem(P + id, data);
              mine = mine.filter(function (x) { return !x || x.id !== id; });
              mine.push({ id: id, name: String(t.name || 'Untitled').slice(0, 80), updated: up });
              changed = true;
            }
            if (changed) ls.setItem(IDX, JSON.stringify(mine));
            var cur = d['plc-trainer.current'];
            if (ls.getItem('plc-trainer.current') === null && typeof cur === 'string' && ls.getItem(P + cur) !== null) ls.setItem('plc-trainer.current', cur);
            var c = d['plc-trainer.channel'];
            if (ls.getItem('plc-trainer.channel') === null && (c === 'stable' || c === 'beta')) ls.setItem('plc-trainer.channel', c);
          } catch (e) { /* a broken hand-over is ignored */ }
          history.replaceState(null, '', location.pathname + location.search);
          ch = ls.getItem('plc-trainer.channel');
        }
        var beta = location.pathname.indexOf('/beta/') >= 0;
        if (ch === 'beta' && !beta) { location.replace(PAGES + 'beta/'); return; }
        if (ch === 'stable' && beta) { location.replace(PAGES); return; }
        if (!ch && beta) ls.setItem('plc-trainer.channel', 'beta');
        return;
      }
      var shell = /Electron\//.test(navigator.userAgent) || (location.protocol === 'https:' && location.hostname === 'localhost');
      if (!shell || /[?&]local=1\b/.test(location.search)) return;
      var n = Number(ls.getItem('plc-trainer.handover')) || 0;
      if (!n && !navigator.onLine) return;   // first start offline: use the built-in copy
      // always hand the built-in copy's projects over: the hosted app only adds keys it does not have, so this is
      // safe to repeat, and a hosted copy too old to read it does not lose them
      var o = {};
      for (var i = 0; i < ls.length; i++) { var key = ls.key(i); if (/^plc-trainer\./.test(key) && key !== 'plc-trainer.handover') o[key] = ls.getItem(key); }
      ls.setItem('plc-trainer.handover', String(n + 1));
      location.replace(PAGES + (ch === 'beta' ? 'beta/' : '') + '#import=' + encodeURIComponent(JSON.stringify(o)));
    })();
  </script>
  <meta name="description" content="PLC trainer: ladder logic editor, power & control circuit wiring simulator, HMI, forcing and live equipment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#D97757">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PLC Trainer">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D97757'/%3E%3Cpath d='M9 8v16M23 8v16M9 16h4M19 16h4M13 12v8M19 12v8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <!-- shared gradients/filters for device drawings (must not be display:none) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gPlastic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eeeeec"/><stop offset="1" stop-color="#e2e2df"/></linearGradient>
      <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4843"/><stop offset="1" stop-color="#2c2b28"/></linearGradient>
      <linearGradient id="gPlc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d9aa6"/><stop offset="1" stop-color="#7b8894"/></linearGradient>
      <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6d9dc"/><stop offset="1" stop-color="#c3c7cb"/></linearGradient>
      <radialGradient id="gChrome" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#eceef0"/><stop offset=".7" stop-color="#c4c7cb"/><stop offset="1" stop-color="#9a9ea3"/></radialGradient>
      <radialGradient id="gMotor" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#4f7fd0"/><stop offset="1" stop-color="#22488f"/></radialGradient>
      <linearGradient id="gRail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c08f"/><stop offset=".5" stop-color="#c8ab72"/><stop offset="1" stop-color="#b39457"/></linearGradient>
      <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc0f0"/><stop offset="1" stop-color="#2a7bbf"/></linearGradient>
      <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8a868"/><stop offset="1" stop-color="#b9864a"/></linearGradient>
      <filter id="fGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="fGlowBig" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <g fill="#D97757">
          <rect x="18.2" y="2" width="3.6" height="14" rx="1.8"/><rect x="18.2" y="24" width="3.6" height="14" rx="1.8"/>
          <rect x="18.2" y="2" width="3.6" height="14" rx="1.8" transform="rotate(60 20 20)"/><rect x="18.2" y="24" width="3.6" height="14" rx="1.8" transform="rotate(60 20 20)"/>
          <rect x="18.2" y="2" width="3.6" height="14" rx="1.8" transform="rotate(120 20 20)"/><rect x="18.2" y="24" width="3.6" height="14" rx="1.8" transform="rotate(120 20 20)"/>
        </g>
      </svg>
      <div>
        <div class="brand-title">PLC Trainer</div>
        <div class="brand-sub"><span data-pname title="Double-click to rename">Untitled</span> <span class="save-st" data-saved title="Projects save automatically in this browser. Ctrl+S saves now.">Saved</span></div>
      </div>
    </div>
    <nav class="tabs" aria-label="Views">
      <button data-view="ladder"><span class="ti">⊢⊣</span>Ladder</button>
      <button data-view="schematic" title="Electrical Diagram (schematic)"><span class="ti">⊢◯</span>Electrical Diagram</button>
      <button data-view="wiring"><span class="ti">⌁</span>Wiring</button>
      <button data-view="hmi"><span class="ti">▭</span>HMI</button>
    </nav>
    <div class="top-actions">
      <button class="btn primary" data-install hidden>⤓ Install app</button>
      <button class="btn ghost" data-examples>Examples ▾</button>
      <button class="btn ghost" data-file>File ▾</button>
      <button class="btn ghost" data-help title="Lessons, guide and keyboard shortcuts">Help ▾</button>
      <button class="icon-btn lang-btn" data-lang-btn title="Language: English (click for Tagalog)">EN</button>
      <button class="icon-btn" data-theme-btn title="Theme">◐</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="plcbar">
    <div class="seg mode" role="group" aria-label="PLC mode"><button data-mode="PROG">PROG</button><button data-mode="RUN">RUN</button></div>
    <div class="leds">
      <span class="led" data-led="pw">POWER</span><span class="led" data-led="run">RUN</span><span class="led amber" data-led="force">FORCE</span><span class="led red" data-led="fault">FAULT</span>
    </div>
    <span class="conn-chip" data-conn hidden></span>
    <button class="tbtn sm" data-forces>Forces: Enabled (0)</button>
    <div class="io-strip" data-io></div>
    <span class="scan" data-scan></span>
    <span class="bar-msg" data-msg></span>
    <span class="spacer"></span>
    <button class="tbtn sm" data-events title="Event log: mode changes, forces, trips, alarms and operator actions">📋 Events <b class="badge" data-evbadge hidden>0</b></button>
    <button class="tbtn sm" data-layout title="Show ladder, wiring, diagram and HMI side by side">▦ Layout</button>
  </div>

  <main id="main">
    <section class="view" id="view-ladder"></section>
    <section class="view" id="view-schematic"></section>
    <section class="view" id="view-wiring"></section>
    <section class="view" id="view-hmi"></section>
    <section class="view" id="view-learn"></section>
    <div class="gutter gv" data-g="v" title="Drag to resize · double-click to reset"></div>
    <div class="gutter gh" data-g="h" title="Drag to resize · double-click to reset"></div>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/ui.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/plc.js"></script>
  <script src="js/ladder.js"></script>
  <script src="js/circuit.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/hmi.js"></script>
  <script src="js/gridroute.js"></script>
  <script src="js/freedraw.js"></script>
  <script src="js/schematic.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/update.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
